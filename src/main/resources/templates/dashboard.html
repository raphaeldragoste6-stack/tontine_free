<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TontineFree</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-layout">

    <!-- BARRE HAUTE MOBILE (Visible uniquement sur mobile) -->
    <header class="mobile-topbar">
        <div class="brand">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <span class="brand-name">Tontine<span>Free</span></span>
        </div>
        <button id="menu-toggle" class="menu-toggle" aria-label="Ouvrir le menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- BARRE DE NAVIGATION SIDEBAR -->
    <aside id="sidebar" class="sidebar">

        <div class="sidebar-brand desktop-only">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <span class="brand-name">Tontine<span>Free</span></span>
        </div>

        <nav class="nav-menu">
            <a th:href="@{/dashboard}" class="nav-item active">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/tontines}" class="nav-item">
                <i class="fa-solid fa-wallet"></i>
                <span>Mes Tontines</span>
            </a>
            <a th:href="@{/membres}" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>Membres</span>
            </a>
            <a th:href="@{/statistiques}" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Statistiques</span>
            </a>
            <a th:href="@{/parametres}" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Paramètres</span>
            </a>

            <!-- BOUTON DÉCONNEXION EN BAS DE PARAMÈTRES -->
            <a th:href="@{/logout}" class="nav-item logout-item">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Déconnexion</span>
            </a>
        </nav>

        <!-- CARTE PROFIL UTILISATEUR -->
        <div class="user-profile">
            <img th:src="${userPicture != null ? userPicture : '/images/default-avatar.png'}" alt="Avatar" class="avatar">
            <div class="user-info">
                <span class="user-name" th:text="${userName}">Raphael Dragoste</span>
                <span class="user-email" th:text="${userEmail}">raphaeldragoste6@gmail.com</span>
            </div>
        </div>

    </aside>

    <!-- OVERLAY POUR FERMER LE MENU EN CLIQUANT À L'EXTÉRIEUR (MOBILE) -->
    <div id="overlay" class="overlay"></div>

    <!-- CONTENU PRINCIPAL DE LA PAGE -->
    <main class="main-content">
        <header class="content-header">
            <h1>Ravi de vous revoir, <span th:text="${userName}">Raphael Dragoste</span> 👋</h1>
            <p>Voici un aperçu de vos activités de tontines.</p>
        </header>

        <!-- Ton contenu principal de dashboard ici -->
    </main>

</div>

<!-- SCRIPT JS POUR LE MENU BURGER -->
<script>
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function toggleMenu() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');

        // Switch icône burger / fermeture
        const icon = menuToggle.querySelector('i');
        if (sidebar.classList.contains('open')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        } else {
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
    }

    menuToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
</script>

</body>
</html>
