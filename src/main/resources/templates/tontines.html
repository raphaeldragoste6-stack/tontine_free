<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/tontines.css}" />
</head>

<body class="container mt-5">

<div class="container">

    <!-- EN-TÊTE DE LA PAGE -->
    <header>
        <h1>Gestion des Tontines</h1>
    </header>

    <!-- SECTION 1 : FORMULAIRE DE CRÉATION -->
    <section class="form-section">
        <h2>Créer une nouvelle tontine</h2>

        <!--
            th:action : Définit l'URL vers laquelle le formulaire sera envoyé en POST.
            th:object : Associe ce formulaire à l'objet DTO 'nouvelleTontine' transmis par le TontineViewController.
            method="post" : Envoie les données au serveur sous forme de requête HTTP POST.
        -->
        <form th:action="@{/tontines/sauvegarder}" th:object="${nouvelleTontine}" method="post">

            <!-- Champ pour le nom de la tontine -->
            <div class="form-group">
                <label for="nom">Nom de la tontine :</label>
                <!-- th:field="*{nom}" lie ce champ de saisie à la propriété 'nom' du DTO -->
                <input type="text" id="nom" th:field="*{nom}" placeholder="Ex: Tontine Famille" required />
            </div>

            <!-- Champ pour la description -->
            <div class="form-group">
                <label for="description">Description :</label>
                <textarea id="description" th:field="*{description}" placeholder="Ex: Cotisation pour les projets de fin d'année"></textarea>
            </div>

            <!-- Champ pour le montant de la cotisation -->
            <div class="form-group">
                <label for="montantCotisation">Montant de la cotisation (FCFA) :</label>
                <input type="number" step="0.01" id="montantCotisation" th:field="*{montantCotisation}" placeholder="Ex: 25000" required />
            </div>

            <!-- Champ de sélection pour la fréquence -->
            <div class="form-group">
                <label for="frequence">Fréquence :</label>
                <select id="frequence" th:field="*{frequence}">
                    <option value="MENSUELLE">Mensuelle</option>
                    <option value="HEBDOMADAIRE">Hebdomadaire</option>
                </select>
            </div>

            <!-- Champ pour la date de début -->
            <div class="form-group">
                <label for="dateDebut">Date de début :</label>
                <!-- type="datetime-local" permet de sélectionner à la fois la date et l'heure -->
                <input type="datetime-local" id="dateDebut" th:field="*{dateDebut}" required />
            </div>

            <!-- Bouton de soumission du formulaire -->
            <button type="submit" class="btn btn-primary">Enregistrer la tontine</button>
        </form>
    </section>

    <!-- SECTION 2 : TABLEAU D'AFFICHAGE DES TONTINES -->
    <section class="table-section">
        <h2>Liste des tontines enregistrées</h2>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th>Montant</th>
                    <th>Fréquence</th>
                    <th>Date de début</th>
                </tr>
                </thead>
                <tbody>
                <!--
                    th:each="tontine : ${tontines}" :
                    Boucle qui parcourt la liste 'tontines' fournie par le Controller et génère une ligne <tr> pour chaque élément.
                -->
                <tr th:each="tontine : ${tontines}">
                    <!-- th:text remplace le contenu du texte par la valeur calculée dynamiquement par Java -->
                    <td th:text="${tontine.nom}">Nom exemple</td>
                    <td th:text="${tontine.description}">Description exemple</td>
                    <td th:text="${tontine.montantCotisation} + ' FCFA'">0 FCFA</td>

                    <!-- Application conditionnelle d'une classe CSS selon la fréquence -->
                    <td>
                                <span th:text="${tontine.frequence}"
                                      th:classappend="${tontine.frequence == 'MENSUELLE'} ? 'badge badge-mensuelle' : 'badge badge-hebdo'">
                                      MENSUELLE
                                </span>
                    </td>

                    <!-- Formatage de la date LocalDateTime au format jour/mois/année heure:minute -->
                    <td th:text="${#temporals.format(tontine.dateDebut, 'dd/MM/yyyy HH:mm')}">01/01/2026 00:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

</body>
</html>
