<!DOCTYPE html>
<!-- Déclaration de l'espace de noms Thymeleaf pour utiliser les attributs th:* -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TontineFree - Gestion de Tontine en Ligne</title>

    <!-- Lien vers le fichier CSS situé dans src/main/resources/static/index.css -->
    <link rel="stylesheet" th:href="@{/index.css}">

    <!-- Police Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Entête avec la barre de navigation -->
<header class="navbar">
    <div class="logo">
        <h2>Tontine<span>Pro</span></h2>
    </div>
    <nav class="nav-links">
        <a href="#features">Fonctionnalités</a>
        <a href="#about">À propos</a>
    </nav>
</header>

<!-- Section Principale (Hero Banner) -->
<section class="hero-container">
    <div class="hero-content">
        <h1>Gérez vos tontines en toute <span>sécurité</span> et simplicité</h1>
        <p>
            Suivez vos cotisations, gérez les membres et automatisez les tirages au sort en quelques clics.
        </p>

        <!-- Zone d'action / Connexion -->
        <div class="auth-box">
            <!-- Bouton de connexion Google OAuth2 géré par Spring Security -->
            <a th:href="@{/oauth2/authorization/google}" class="btn-google">
                <!-- SVG du logo Google -->
                <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                Se connecter avec Google
            </a>
        </div>
    </div>
</section>

<!-- Pied de page -->
<footer class="footer">
    <p>&copy; 2026 TontinePro. Tous droits réservés.</p>
</footer>

</body>
</html>
